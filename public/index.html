
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Luviê Live</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      margin: 0;
      padding: 24px;
      color: #302724;
    }
    main { max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-top: 16px;
    }
    button {
      background: #302724;
      color: white;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Luviê Live</h1>
    <div class="card">
      <h2>Controle da Live</h2>
      <p>Status: aguardando configuração</p>
      <button disabled>Iniciar leitura</button>
    </div>
    <div class="card">
      <h2>Peças cadastradas</h2>
      <p>Nenhuma peça cadastrada.</p>
    </div>
    <div class="card">
      <h2>Pedidos recebidos</h2>
      <p>Nenhum pedido ainda.</p>
    </div>
  </main>
</body>
</html>
