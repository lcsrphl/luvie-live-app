
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luviê Live | Importar peças</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Luviê Live</h1>
    <p class="muted">Cadastro de peças por arquivo TXT</p>

    <section id="loginCard" class="card">
      <h2>Entrar no painel</h2>

      <label for="email">E-mail</label>
      <input id="email" type="email"
        autocomplete="username"
        placeholder="Seu e-mail administrativo">

      <label for="password">Senha</label>
      <input id="password" type="password"
        autocomplete="current-password"
        placeholder="Sua senha">

      <button id="login">Entrar</button>
    </section>

    <section id="appCard" class="hidden">
      <div class="line">
        <p id="userLabel" class="muted"></p>
        <button id="logout" class="secondary">Sair</button>
      </div>

      <div class="card">
        <h2>Importar peças</h2>
        <p class="muted">
          Selecione o TXT que contém Código, Descrição e Preço.
        </p>

        <input id="file" type="file" accept=".txt,text/plain">

        <div class="line">
          <strong id="count">Nenhum arquivo selecionado</strong>
          <span id="total"></span>
        </div>

        <div id="preview"></div>

        <div class="buttons actions">
          <button id="save" disabled>
            Cadastrar peças no Firebase
          </button>
          <button id="clear" class="secondary">Limpar</button>
        </div>
      </div>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="/__/firebase/8.10.1/firebase-app.js"></script>
  <script src="/__/firebase/8.10.1/firebase-auth.js"></script>
  <script src="/__/firebase/8.10.1/firebase-firestore.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="app.js"></script>
</body>
</html>
